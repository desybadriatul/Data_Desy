# DRAFT — for merge into the live business_problem_registry.yaml. This is the layer that separates "what
# business question is the client asking" from "which report type answers it" (per the mid-July architecture
# audit finding that report_type_id alone conflated the two). Reconcile field names against the live file
# before merge — it was not available in this session.

business_problem_id: brand_perception_and_positioning
label: "Brand perception & competitive positioning"

primary_report_type: evo_perception_intelligence
secondary_report_types:
  - competitive_analysis
  - brand_content_effectiveness

distinguishing_signal: >
  The question is about what perception MEANS and WHY — not how much volume, sentiment, or share of voice
  a brand has. That distinction is what routes the question to EVO instead of Competitive Analysis or
  Daily Social, which answer "how much" and "what happened" rather than "what does this mean and why."

routing:
  route_when: >
    the primary question concerns perception, association, attribute ownership, positioning, or
    perception-building activity.
  route_elsewhere_when:
    - condition: "compare volume / sentiment / SOV across brands"
      route_to: competitive_analysis
    - condition: "content & channel effectiveness (what content works, not what it means)"
      route_to: brand_content_effectiveness
    - condition: "live crisis detection or an active spike needing immediate triage"
      route_to: spokesperson_intelligence   # or scan_anomalies / smart-alert path, not a Jalur 1 report
    - condition: "media coverage volume/tone analysis, not perception attribution"
      route_to: mainstream_media_report

example_business_questions:
  - "Apa yang membuat konsumen memilih kompetitor kami, bukan sekadar volume percakapannya?"
  - "Brand kami dianggap seperti apa dibanding Best Brand di kategori ini, dan kenapa?"
  - "Attribute mana yang kami menangkan diam-diam dan bisa diperkuat?"
  - "What does our brand actually mean to people right now, and where does that meaning lose to the category leader?"
