skill:
  id: evo-perception-intelligence
  report_type_id: evo_perception_intelligence
  name: "EVO Perception Intelligence Report"
  version: "1.3"
  owner: Dataxet Sonar
  status: active
  jalur: 1                   # bottom-up, explicit report type

revision_notes:
  - version: "1.3"
    changes:
      - "Activated the EVO Task 1 builder, Task 2 workflow and renderer, report registry routing, and MCP tool surface."
      - "Registered EVO metric contracts, R-EVO visual recipes, and EVO-specific render quality checks."
      - "Connected the existing incremental attribute-enrichment pipeline to the report workflow."
  - version: "1.2"
    changes:
      - "Added single-stage problem diagnosis to evo_journey_model.md §4.2 (Awareness / Engagement / Perception Impact each now have their own 'where the problem sits' + 'what to do' table), alongside the existing transition-leak diagnosis (§4.1)."
      - "Cross-referenced the new diagnosis from evo_recommendation_vocabulary.md as a second, independent route to a move alongside the posture table, with an explicit rule for when the two disagree."
      - "Extended D3 Focus-Brand Intervention Map's required output and G6 Journey integrity to require every material journey diagnosis (transition or single-stage) to resolve to a move, mirroring the posture completeness bar."
  - version: "1.1"
    changes:
      - "Added evo_visual_contract.md and evo_external_strategic_analogies.md to primary_files, read_order, and frozen_output."
      - "Closed posture->move derivation gap: all 6 evo_metric_dictionary.md postures now have an explicit move rule (evo_recommendation_vocabulary.md)."
      - "Added QA gate G14 (client-facing language integrity), after an internal QA test name was found leaking onto a client-facing slide."
      - "Added an operational metric-manifest / freeze-sheet protocol to Tier A metric-consistency, after the same brand volume appeared as two different numbers across slides."
      - "Added a renumbering-on-skip rule for Conditional components (evo_report_structure.md), after a skipped component left an unrenumbered gap and shifted page footers."
      - "Made the classification-audit funnel schema nested and single-basis (evo_classification_contract.md), after tagged/unmapped counts were found reconciling against two different bases."
      - "Reconciled enrichment_plan against the live Cogan enrichment_requirements shape (topic/spokesperson pattern observed via get_report_enrichment_plan)."
  - version: "1.0"
    changes:
      - "Initial draft registry entry, business-problem entry, and skill-pack content."

description: >
  Standalone Jalur 1 report type that reads a brand through Experience / Values / Offer, diagnoses which
  attributes own perception, benchmarks the focus brand (Best Brand, Attribute Gap, Whitespace), traces
  perception through Awareness -> Engagement -> Perception Impact, and closes on a client-owned
  perception-building decision (Scale / Fix / Protect / Build / Test / Monitor / Avoid).

business_problem:
  business_problem_id: brand_perception_and_positioning
  label: "Brand perception & competitive positioning"
  primary_report_type: evo_perception_intelligence
  secondary_report_types: [competitive_analysis, brand_content_effectiveness]
  distinguishing_signal: >
    The question is about what perception MEANS and WHY, not how much volume / sentiment / SOV a brand has.
    That distinction routes to EVO instead of Competitive Analysis or Daily Social.

routing:
  triggers:
    - "EVO"
    - "EVO report"
    - "EVO perception"
    - "persepsi EVO"
    - "perception intelligence"
    - "brand perception report"
    - "competitive perception"
    - "Experience Values Offer"
  route_when: >
    the primary question concerns perception, association, attribute ownership, positioning, or
    perception-building activity.
  route_elsewhere_when:
    - "compare volume / sentiment / SOV -> competitive_analysis"
    - "content & channel effectiveness -> brand_content_effectiveness"
    - "live crisis detection -> spokesperson_intelligence / smart alert"
    - "media coverage analysis -> mainstream_media_report"

tool_group:
  - create_evo_perception_intelligence_report_workflow
  - build_evo_perception_intelligence_report_data_preview
  - build_evo_perception_intelligence_report_ppt_package

tool_sequence: >
  create_evo_perception_intelligence_report_workflow
    -> build_evo_perception_intelligence_report_data_preview
    -> preview_confirmed (user)
    -> build_evo_perception_intelligence_report_ppt_package

requirements:
  requires_benchmark_brands: true      # focus + >=1 competitor; comparative by design
  requires_attribute_map: true         # client-approved -> category -> evo_seed fallback
  requires_audience: true              # return NEEDS_AUDIENCE and ask if absent
  min_data_confidence: directional
  spokesperson_enrichment: none        # topic-only class, like Daily Social / Competitive Analysis

enrichment_plan:                       # shape reconciled against live get_report_enrichment_plan() output
  report_type_id: evo_perception_intelligence
  topic:
    enabled: true
    mode: "balanced_cross_brand_sample"   # same mode competitive_analysis uses; EVO is comparative by design
    hard_max_items: 150
    allow_auto_expand: false
  attribute:                           # the one net-new data-layer step (see evo_classification_contract.md)
    enabled: true
    mode: "stratified_10pct"
    hard_max_items: 100                # matches the <=100 content/request cap in evo_classification_contract.md
    allow_auto_expand: false
    run_after_topic_ready: true        # attribute tagging reads the same canonical rows topic tagging resolved
  spokesperson:
    enabled: false                     # EVO is topic/attribute-only, like Daily Social / Competitive Analysis
    run_after_topic_ready: false
  source_role_classification: true     # feeds evo_journey_model.md; not yet a shared enrichment_requirements field
  journey_stage_classification: true   # feeds evo_journey_model.md; not yet a shared enrichment_requirements field
  business_impact_data: conditional    # only when external survey/CRM/analytics data is supplied

frozen_output:                         # Task 1 -> Task 2 handoff; Task 2 never recomputes
  - evo_report_data.json
  - evo_data_preview.json
  - evo_metric_manifest.json           # the metric freeze-sheet enforced by evo_quality_gate.md Tier A
  - evo_evidence_manifest.json
  - evo_classification_audit.json      # now a nested, single-basis funnel (see evo_classification_contract.md)
  - evo_external_analogy_manifest.json # validated External Analogy sources (evo_external_strategic_analogies.md)
  - evo_quality_report.json
  - evo_component_completeness_audit.json  # also carries original component_id through renumbering-on-skip

primary_files:
  guide: SKILL.md
  framework: references/evo_framework.md
  attribute_map: references/evo_attribute_map.md
  classification_contract: references/evo_classification_contract.md
  metric_dictionary: references/evo_metric_dictionary.md
  journey_model: references/evo_journey_model.md
  evidence_standard: references/evo_evidence_standard.md
  report_structure: references/evo_report_structure.md
  visual_contract: references/evo_visual_contract.md
  recommendation_vocabulary: references/evo_recommendation_vocabulary.md
  external_analogies: references/evo_external_strategic_analogies.md
  quality_gate: references/evo_quality_gate.md
  readiness_gap: readiness_gap.md

shared_dependencies:                   # from the insight-report-generator engine — EVO extends, never forks
  consistency_contract: insight-report-generator/references/consistency_contract.md
  quality_framework: insight-report-generator/references/quality_framework.md
  skill_report: insight-report-generator/references/skill_report.md   # source of the §8 jargon rule G14 inherits

read_order:
  - SKILL.md
  - references/evo_framework.md
  - references/evo_attribute_map.md
  - references/evo_classification_contract.md
  - references/evo_metric_dictionary.md
  - references/evo_journey_model.md
  - references/evo_evidence_standard.md
  - references/evo_report_structure.md
  - references/evo_visual_contract.md
  - references/evo_recommendation_vocabulary.md
  - references/evo_external_strategic_analogies.md
  - references/evo_quality_gate.md
  - "(shared) consistency_contract.md + quality_framework.md + skill_report.md before final delivery"
